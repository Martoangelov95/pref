name: Refresh Fundamentals

on:
  schedule:
    # Once daily at 2am UTC — scrapes QuantumOnline for fundamental data
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh fundamentals from QuantumOnline
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/refresh-fundamentals"
