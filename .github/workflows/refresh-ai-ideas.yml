name: Refresh AI Ideas

on:
  schedule:
    # Nightly at 4am UTC, weekdays only — runs batch AI screener
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate AI trade ideas
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/refresh-ai-ideas"
